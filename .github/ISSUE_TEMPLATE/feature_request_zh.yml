name: 功能建议
description: 为 SATLI 提出新功能或改进建议
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        感谢你为 SATLI 提出建议。提交前请先搜索已有 Issue，确认没有相同或相似的建议。

        请围绕“管理器”本身的能力（扫描、安装、编辑、恢复、网络、更新等）提出建议；若只是希望某个游戏新增译本，请在应用内发起翻译请愿或前往翻译库提交，而不是在这里创建 Issue。

  - type: dropdown
    id: related-area
    attributes:
      label: 建议涉及的功能
      description: 请选择该建议最相关的功能模块。
      options:
        - 游戏扫描与本地游戏列表
        - 云端目录与译本下载
        - 翻译安装、更新或恢复
        - 已管理游戏与修订历史
        - 本地导入或成就编辑器
        - 设置、网络、下载源或 GitHub 绑定
        - 软件更新或日志
        - 界面与交互体验
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
      description: 请说明当前遇到了什么不便，或有哪些使用场景尚未被覆盖。
      placeholder: 描述现状与痛点。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的解决方案
      description: 请描述你希望软件如何运作，或希望新增的能力。可附上草图、界面参考或操作流程。
      placeholder: 描述你期望的行为或界面。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 是否考虑过其他实现方式，或现有功能能否部分满足需求？
      placeholder: 说明其他可能的做法。
    validations:
      required: false

  - type: textarea
    id: value
    attributes:
      label: 带来的价值
      description: 简述这项改进对用户（或你）的意义，帮助评估优先级。
      placeholder: 例如：省去手动操作、提升成功率、覆盖更多游戏等。
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: 补充信息
      description: 可补充相关截图、示例游戏、参考项目或任何有助于理解的说明。
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，没有发现相同或相似的功能建议。
          required: true
        - label: 我理解这只是针对管理器本身的功能建议；某个游戏的具体译本请求应通过应用内请愿或翻译库提交。
          required: true
