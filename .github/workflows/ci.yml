name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src tests scripts
      - run: python -m pytest -q
      - run: python -m satl --version
      - run: python scripts/offline_smoke.py

  package:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Build release package
        shell: powershell
        env:
          SATL_SIGNING_CERTIFICATE_SHA1: ${{ vars.SATL_SIGNING_CERTIFICATE_SHA1 }}
        run: |
          if ('${{ startsWith(github.ref, 'refs/tags/v') }}' -eq 'true') {
            ./scripts/build.ps1 -RequireCodeSigning
          }
          else {
            ./scripts/build.ps1
          }
      - name: Rename manual test build
        if: github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          $source = Get-ChildItem 'dist/release' -Filter 'SATLInstaller-Setup-v*.exe' |
            Select-Object -First 1
          if (-not $source) {
            throw 'Installer executable was not produced.'
          }

          $target = Join-Path $source.DirectoryName "$($source.BaseName)-test$($source.Extension)"
          Move-Item -LiteralPath $source.FullName -Destination $target

          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $target).Hash.ToLowerInvariant()
          "$hash *$(Split-Path -Leaf $target)" |
            Set-Content -Encoding ascii 'dist/release/SHA256SUMS.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: satl-installer-win-x64
          path: |
            dist/release/SATLInstaller-Setup-v*.exe
            dist/release/SHA256SUMS.txt
