name: Build Microsoft Store MSIX

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-store-msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: dotnet test ./tests/Satl.Gui.Tests/Satl.Gui.Tests.csproj -c Release -p:Platform=x64
      - name: Build unsigned Store package
        shell: powershell
        run: ./scripts/build.ps1 -Target StoreMsix
      - uses: actions/upload-artifact@v4
        with:
          name: satl-microsoft-store-msix
          path: |
            dist/release/SATLInstaller-Store-v*.msix
            dist/release/SHA256SUMS.txt
